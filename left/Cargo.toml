[package]
name = "left"
version = "0.1.0"
authors = ["Joakim Hulthe <joakim@hulthe.net>"]
description = "Keyboard firmware"
edition = "2021"

[dependencies.tk-pie]
path = "../lib"
package = "tk-pie"

[target.thumbv6m-none-eabi.dependencies]
cortex-m-rt = "0.7"
embassy-rp = { version = "0.9.0", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-executor = { version = "0.9.1", features = ["nightly", "executor-thread", "arch-cortex-m"] }
embassy-sync = "0.5.0"
embassy-time = "0.5.0"
embassy-futures = "0.1.2"
log = "0.4.17"
postcard = { version = "1.0.4", features = ["alloc"] }

[build-dependencies]
ron = "0.8.0"
postcard = { version = "1", features = ["use-std"] }

[build-dependencies.tk-pie]
path = "../lib"
package = "tk-pie"
