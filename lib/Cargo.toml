[package]
name = "tk-pie"
version = "0.1.0"
authors = ["Joakim Hulthe <joakim@hulthe.net>"]
description = "Keyboard firmware"
edition = "2021"

[dependencies]
cortex-m = "0.7.6"
cortex-m-rt = "0.7.0"
embedded-hal = "1.0.0"
static_cell = "1.0.0"
embedded-io-async = "0.6.1"
futures = { version = "0.3.0", default-features = false, features = ["async-await"] }
embassy-executor = { version = "0.9.1", features = ["nightly", "executor-thread"] }
embassy-sync = "0.5.0"
embassy-time = "0.5.0"
embassy-futures = "0.1.2"
embassy-usb = { version = "0.5.1", default-features = false }
log = "0.4.29"
pio-proc = "0.2.1"
smart-leds = "0.3.0"
embedded-alloc = { version = "0.7.0", features = ["llff"] }
postcard = { version = "1.0.4", features = ["alloc"] }
fixed = "1.30.0"
rtt-target = "0.6.2"
heapless = "0.9.2"
once_cell = { version = "1.21.4", default-features = false }
critical-section = "1.2.0"
crc-any = "2.4.3"
serde = { version = "1.0.163", default-features = false, features = ["derive"] }
bytemuck = { version = "1.13.1", features = ["derive"] }
libm = "0.2.8"
glam = { version = "0.25.0", default-features = false, features = ["libm"] }
msgpck = { version = "0.2.8", features = ["alloc"] }
portable-atomic = { version = "1.6.0", default-features = false }
rend = { version = "0.4.2", features = ["bytemuck"], default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
embassy-executor = { version = "0.9.1", features = ["arch-std"] }
embassy-time = { version = "0.5.0", features = ["std"] }
simple_logger = "4"

[target.thumbv6m-none-eabi.dependencies]
embassy-rp = { version = "0.9.0", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-interrupt"] }
embassy-usb = { version = "0.5.1", features = ["usbd-hid"] }
embassy-usb-logger = "0.5.1"
embassy-usb-driver = "0.2.0"
usb-device = "0.3.2"
usbd-hid = "0.9.0"

[build-dependencies]
ron = "0.8.0"
postcard = { version = "1", features = ["use-std"] }

[features]
std = []
default = ["n-key-rollover"]
n-key-rollover=[]
